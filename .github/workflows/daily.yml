name: Daily MLB Report

on:
  schedule:
    # HOURLY CHECK, ONE PUBLISH. auto_gate.py finds the earliest game across
    # EVERY sport today and publishes exactly once, AUTO_RUN_LEAD_MINUTES
    # before it -- so a noon college football kickoff triggers an 11:00 AM
    # publish, and an evening-only slate waits until evening.
    - cron: "0 11-23,0-3 * * *"   # hourly, 07:00-22:00 ET
    - cron: "0 6 * * *"           # 02:00 ET overnight grading (GRADE ONLY)
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GRADING_CRON: "0 6 * * *"

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (gated publish, overnight grading, or forced manual run)
        env:
          STATS_MODE: api
          ODDS_MODE: api
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # ------------------------------------------------------------------
          # WHOP AUTO-POSTING IS OFF (Sep 4, 2026) -- posting to the community
          # is manual now. output/publish_whop.py is a deliberate no-op when
          # these are absent, so NOT passing them here is the whole switch.
          # WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          # WHOP_EXPERIENCE_ID: ${{ secrets.WHOP_EXPERIENCE_ID }}
          # ------------------------------------------------------------------
          PUBLIC_BETTING_MODE: manual
          PUBLIC_BETTING_URL: ""
          TIMEZONE: America/New_York
          DAILY_RUN_HOUR: "10"
          DAILY_RUN_MINUTE: "0"
          AUTO_RUN_LEAD_MINUTES: "60"
        run: |
          if [ "${{ github.event.schedule }}" = "${{ env.GRADING_CRON }}" ]; then
            echo "Overnight GRADING pass -- settling yesterday's finished games. Will NOT publish."
            python run_daily.py --date "$(TZ=America/New_York date -d 'yesterday' +%F)"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Hourly gate check -- publishes only if within the lead window and not already published today."
            python run_daily.py --auto
          else
            echo "Manually triggered -- forcing a fresh run + publish."
            python run_daily.py
          fi

      # ------------------------------------------------------------------
      # WHY THE GRADING RUN MUST NOT PUBLISH (Sep 5, 2026)
      # The 02:00 ET pass runs with `--date yesterday` so it can settle games
      # that finished overnight. But run_daily.py always RENDERS a report for
      # whatever date it was given -- so that pass produced YESTERDAY's report
      # and copied it over index.html, silently reverting the live page from
      # today back to yesterday a few hours after it published correctly.
      #
      # That is exactly what happened here: the evening run published Sep 5,
      # then the 5:33 AM grading pass overwrote it with Sep 4. The run showed
      # SUCCESS both times, because overwriting is not an error -- it was just
      # the wrong file.
      #
      # The grading pass now skips the copy entirely. It still grades, still
      # commits the updated database, and leaves the live page alone.
      # ------------------------------------------------------------------
      - name: Publish report to the permanent link
        run: |
          if [ "${{ github.event.schedule }}" = "${{ env.GRADING_CRON }}" ]; then
            echo "Grading pass -- deliberately NOT touching index.html so the live page keeps today's report."
            exit 0
          fi
          if [ -f data_store/reports/latest.html ]; then
            cp data_store/reports/latest.html index.html
            echo "Report copied to the permanent root link."
          else
            echo "No report generated this run -- leaving the existing index.html in place."
          fi
          if [ -d p ]; then
            rm -rf p
            echo "Removed leftover rotating /p/ folders."
          fi

      # ------------------------------------------------------------------
      # WHY THE STAGING IS SPLIT INTO SEPARATE COMMANDS (Sep 5, 2026)
      # This step used to run, in one line:
      #     git add -A index.html p
      # `p` is the old rotation folder, long deleted. git treats an unmatched
      # pathspec as FATAL for the whole command -- so once `p` was gone, that
      # single `git add` failed and staged NOTHING, index.html included.
      # `2>/dev/null || true` hid the error and the step printed "Nothing new
      # to publish", so the pipeline reported SUCCESS while the live page sat
      # frozen for days. Each path is staged on its own line now.
      # ------------------------------------------------------------------
      - name: Publish report + save history back to the repo
        run: |
          git config user.name "mlb-picks-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -f index.html ]; then
            git add -f index.html
          fi
          if git ls-files --error-unmatch p >/dev/null 2>&1; then
            git add -A p
          fi
          git add -f data_store/betting_engine.db 2>/dev/null || true
          git add -f data_store/last_published.txt 2>/dev/null || true
          git add -f manual_inputs/*.json 2>/dev/null || true

          echo "--- staged for commit ---"
          git diff --cached --name-only

          if git diff --cached --quiet; then
            echo "Nothing new to publish this check."
          else
            git commit -m "Automated daily update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
            echo "Pushed. Live page will refresh once GitHub Pages rebuilds (~1 min)."
          fi

      # Fail loudly if a report was generated but the live page didn't get it.
      # A silent no-publish is the exact failure that hid the pathspec bug.
      - name: Verify the live page actually got today's report
        run: |
          if [ "${{ github.event.schedule }}" = "${{ env.GRADING_CRON }}" ]; then
            echo "Grading pass -- no publish expected, nothing to verify."
            exit 0
          fi
          if [ ! -f data_store/reports/latest.html ]; then
            echo "No report this run (gate skipped it) -- nothing to verify."
            exit 0
          fi
          REPORT_DATE=$(grep -o 'Daily Betting Report — [0-9-]\{10\}' index.html | head -1 | grep -o '[0-9-]\{10\}' || echo "unknown")
          echo "index.html is serving report date: $REPORT_DATE"
          if git status --porcelain index.html | grep -q .; then
            echo "::error::index.html changed but was NOT committed -- the live page will stay stale."
            exit 1
          fi
          echo "index.html is committed and matches the generated report."

      - name: Show the member link
        run: |
          LINK="https://kfxcode.github.io/bet-engine-v1/"
          {
            echo "## Cover1Picks member link"
            echo ""
            echo "**$LINK**"
            echo ""
            echo "Permanent -- paste into Whop once."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "MEMBER LINK: $LINK"
