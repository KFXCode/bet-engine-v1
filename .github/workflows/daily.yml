name: Daily MLB Report

on:
  schedule:
    # TWO runs a day, which is all the system needs:
    #  1) 09:00 ET pre-game  -- builds and publishes the day's picks.
    #  2) 02:00 ET overnight -- grades every game that finished, so records
    #     and history are correct before you wake up.
    # It used to run every 30 minutes, which is what drained the odds credits.
    - cron: "0 13 * * *"   # 09:00 ET  (pre-game publish)
    - cron: "0 6 * * *"    # 02:00 ET  (overnight grading)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (pre-game publish, overnight grading, or forced manual run)
        env:
          STATS_MODE: api
          ODDS_MODE: api
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PUBLIC_BETTING_MODE: manual
          PUBLIC_BETTING_URL: ""
          TIMEZONE: America/New_York
          DAILY_RUN_HOUR: "10"
          DAILY_RUN_MINUTE: "0"
          AUTO_RUN_LEAD_MINUTES: "60"
        run: |
          # The 06:00 UTC (02:00 ET) slot is the grading pass: yesterday's
          # games are final, so grade them for YESTERDAY's date. It does not
          # try to publish a new slate -- picks are published by the morning
          # run only, so an overnight run can never overwrite a locked board.
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "Overnight grading pass -- settling yesterday's finished games."
            python run_daily.py --date "$(TZ=America/New_York date -d 'yesterday' +%F)"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Pre-game scheduled run -- auto-gated publish."
            python run_daily.py --auto
          else
            echo "Manually triggered -- forcing a fresh run + publish regardless of timing/once-a-day gate."
            python run_daily.py
          fi

      - name: Publish report + save history back to the repo
        run: |
          if [ -f data_store/reports/latest.html ]; then
            cp data_store/reports/latest.html index.html
          fi
          git config user.name "mlb-picks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f index.html 2>/dev/null || true
          git add -f data_store/betting_engine.db 2>/dev/null || true
          git add -f data_store/last_published.txt 2>/dev/null || true
          git add -f manual_inputs/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish this check."
          else
            git commit -m "Automated daily update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
